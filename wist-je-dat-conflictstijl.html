<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wist je dat?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:10px 12px;background:#fff;font-family:"Montserrat",Arial,sans-serif;color:#3e281a}
.card{max-width:820px;margin:0 auto;display:flex;align-items:flex-start;gap:14px;border-left:5px solid #96f0ff;padding:14px 16px;background:#fff}
.icon{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ecfcff;font-size:23px;box-shadow:0 0 18px rgba(150,240,255,.55)}
.content h3{margin:0 0 5px;color:#003c24;font-size:16px;line-height:1.3;font-weight:600}
.content p{margin:0;font-size:14px;line-height:1.6}
.content strong{font-weight:600}
@media(max-width:520px){
  body{padding:8px}
  .card{padding:12px 13px;gap:11px}
  .icon{flex-basis:40px;width:40px;height:40px;font-size:21px}
  .content p{font-size:13.5px}
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">💡</div>
  <div class="content">
    <h3>Wist je dat?</h3>
    <p>Je conflictstijl <strong>kan veranderen per situatie</strong>? Bij vrienden reageer je misschien anders dan op school of werk. <strong>De persoon, situatie en wat er voor jou op het spel staat</strong> hebben invloed op hoe je reageert. Je hebt dus niet één vaste conflictstijl.</p>
  </div>
</div>
</body>
</html>
