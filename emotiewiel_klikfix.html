<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emotiewiel</title>
<style>
:root{--green:#003c24;--orange:#ff4a00;--brown:#3e281a;}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--brown)}
.wrap{max-width:820px;margin:auto;padding:14px}
.intro,.helper{text-align:center;line-height:1.45}
.intro{font-size:17px;margin:0 0 8px}
.helper{font-size:15px;color:var(--green);font-weight:700;margin:0 0 10px}
.viewport{position:relative;max-width:645px;aspect-ratio:645/710;margin:auto;overflow:hidden;background:#fff}
.canvas{position:absolute;inset:0;transition:transform .5s ease;transform-origin:50% 50%}
.canvas img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.overlay{position:absolute;inset:0;width:100%;height:100%;z-index:5}
.clickzone{fill:#fff;fill-opacity:.001;stroke:none;cursor:pointer;pointer-events:all}
.clickzone:hover{fill-opacity:.05}
.subzone{display:none}
.zoomed .basezone{display:none}
.zoomed .subzone.active{display:block}
.controls{display:none;justify-content:center;margin-top:12px}
.controls.show{display:flex}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.back{background:var(--green);color:#fff}
.reset{background:var(--orange);color:#fff;margin-top:14px}
.result{display:none;max-width:645px;margin:14px auto 0;background:#f7fff5;border:2px solid #d7ead3;border-radius:16px;padding:18px}
.result.show{display:block}
.result .crumb{font-size:13px;opacity:.7;margin-bottom:4px}
.result h2{margin:0;color:var(--green);font-size:24px}
.result p{line-height:1.5;margin:10px 0 0}
.reflect{padding-top:12px;border-top:1px solid #d7ead3}
@media(max-width:600px){.wrap{padding:8px}.intro{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="controls" id="controls">
    <button class="back" id="back" type="button">Terug naar hele wiel</button>
  </div>

  <div class="result" id="result" aria-live="polite">
    <div class="crumb" id="crumb"></div>
    <h2 id="choice"></h2>
    <p id="explanation"></p>
    <p class="reflect" id="reflection"></p>
    <button class="reset" id="reset" type="button">Opnieuw beginnen</button>
  </div>
</div>

<script>
(() => {
const cx=322.5, cy=392;
const NS="http://www.w3.org/2000/svg";
const overlay=document.getElementById("overlay");
const viewport=document.getElementById("viewport");
const canvas=document.getElementById("canvas");
const helper=document.getElementById("helper");
const controls=document.getElementById("controls");
const result=document.getElementById("result");
const crumb=document.getElementById("crumb");
const choice=document.getElementById("choice");
const explanation=document.getElementById("explanation");
const reflection=document.getElementById("reflection");

const groups=[
 {key:"blij",name:"Blij",start:-72,details:["Trots","Nieuwsgierig","Gemotiveerd","Dankbaar","Verbonden"]},
 {key:"boos",name:"Boos",start:0,details:["Geïrriteerd","Gefrustreerd","Gestrest","Gekwetst","Woedend"]},
 {key:"bang",name:"Bang",start:72,details:["Onzeker","Gespannen","Overprikkeld","Bezorgd","Nerveus"]},
 {key:"bedroefd",name:"Bedroefd",start:144,details:["Somber","Eenzaam","Machteloos","Leeg","Verdrietig"]},
 {key:"bah",name:"Bah",start:216,details:["Weerstand","Afgewezen","Beschaamd","Afstandelijk","Afkeer"]}
];

const info={
"Trots":["Trots voel je wanneer je blij bent met iets wat je hebt gedaan, bereikt of overwonnen.","Waar ben jij op dit moment trots op?"],
"Nieuwsgierig":["Nieuwsgierigheid is het gevoel dat je iets wilt ontdekken, begrijpen of uitproberen.","Waar zou je nu meer over willen weten?"],
"Gemotiveerd":["Je voelt je gemotiveerd wanneer je zin en energie hebt om ergens voor te gaan.","Waar wil jij je energie nu voor gebruiken?"],
"Dankbaar":["Dankbaarheid ontstaat wanneer je stilstaat bij iets of iemand dat waardevol voor je is.","Waar ben jij vandaag dankbaar voor?"],
"Verbonden":["Je voelt je verbonden wanneer je je dichtbij, gezien of begrepen voelt door anderen.","Bij wie of waar voel jij je verbonden?"],
"Geïrriteerd":["Geïrriteerd is een lichte vorm van boosheid. Iets stoort je of gaat anders dan je wilt.","Wat zit je op dit moment dwars?"],
"Gefrustreerd":["Frustratie ontstaat vaak wanneer iets niet lukt of wanneer je wordt tegengehouden.","Wat lukt nu niet zoals je zou willen?"],
"Gestrest":["Bij stress ervaren je hoofd en lichaam veel druk. Je kunt je gehaast, gespannen of onrustig voelen.","Wat vraagt op dit moment veel van je?"],
"Gekwetst":["Je voelt je gekwetst wanneer iets wat iemand doet of zegt je pijn doet.","Wat raakte jou in deze situatie?"],
"Woedend":["Woede is een sterke vorm van boosheid. Je kunt veel energie voelen en direct willen reageren.","Wat maakt dit zo belangrijk voor jou?"],
"Onzeker":["Onzekerheid betekent dat je twijfelt aan jezelf, een situatie of wat er gaat gebeuren.","Waar twijfel je op dit moment over?"],
"Gespannen":["Je bent gespannen wanneer je lichaam zich voorbereidt op iets dat spannend of belangrijk voelt.","Waar voel je de spanning in je lichaam?"],
"Overprikkeld":["Je bent overprikkeld wanneer er te veel geluiden, gedachten, mensen of gebeurtenissen tegelijk binnenkomen.","Wat zou je even kunnen verminderen of loslaten?"],
"Bezorgd":["Je bent bezorgd wanneer je veel nadenkt over iets dat misschien kan gebeuren. Je hoofd probeert problemen vooruit te zien.","Waar ben je bezorgd over en wat zou je nu helpen?"],
"Nerveus":["Nerveus zijn betekent dat je spanning voelt voor iets dat nog moet gebeuren.","Wat staat er te gebeuren waardoor je je nerveus voelt?"],
"Somber":["Somberheid kan zwaar of donker voelen. Je hebt misschien minder zin, energie of plezier dan normaal.","Wat zou vandaag een klein beetje steun kunnen geven?"],
"Eenzaam":["Eenzaamheid betekent dat je behoefte hebt aan meer contact of verbinding, ook als er mensen om je heen zijn.","Met wie zou je contact willen maken?"],
"Machteloos":["Je voelt je machteloos wanneer je weinig invloed ervaart op wat er gebeurt.","Waar heb je wél invloed op, al is het maar een klein beetje?"],
"Leeg":["Je leeg voelen kan betekenen dat je weinig emotie of energie ervaart, alsof er even niets binnenkomt.","Wat heb je nodig om weer iets van ruimte of contact te voelen?"],
"Verdrietig":["Verdriet ontstaat wanneer iets pijn doet, tegenvalt of wanneer je iets of iemand mist.","Wat heeft jouw verdriet op dit moment nodig?"],
"Weerstand":["Weerstand betekent dat iets in jou 'nee' zegt. Je wilt iets niet of iets voelt niet goed.","Waar zegt jouw gevoel nu nee tegen?"],
"Afgewezen":["Je voelt je afgewezen wanneer je het idee hebt dat je niet wordt gekozen, geaccepteerd of erbij hoort.","Wat zou jou nu kunnen helpen om je weer gezien te voelen?"],
"Beschaamd":["Schaamte ontstaat wanneer je bang bent dat anderen negatief over jou denken of wanneer je jezelf veroordeelt.","Wat zou je tegen een vriend zeggen die hetzelfde meemaakt?"],
"Afstandelijk":["Je voelt je afstandelijk wanneer je minder contact wilt of emotioneel op afstand gaat.","Heb je nu ruimte nodig, of juist verbinding?"],
"Afkeer":["Afkeer is een sterk gevoel van 'dit wil ik niet'. Het kan je helpen afstand te nemen van iets dat niet goed voelt.","Waar wil je op dit moment afstand van nemen?"]
};

function point(r,deg){
  const a=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(a),cy+r*Math.sin(a)];
}
function ringPath(r1,r2,a0,a1){
  const A=point(r2,a0),B=point(r2,a1),C=point(r1,a1),D=point(r1,a0);
  return `M ${A[0]} ${A[1]} A ${r2} ${r2} 0 0 1 ${B[0]} ${B[1]} L ${C[0]} ${C[1]} A ${r1} ${r1} 0 0 0 ${D[0]} ${D[1]} Z`;
}
function zone(cls,d,label,group){
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",d); p.setAttribute("class","clickzone "+cls);
  p.setAttribute("aria-label",label); p.setAttribute("tabindex","0");
  p.dataset.group=group;
  return p;
}

let current=null;

groups.forEach(g=>{
  const base=zone("basezone",ringPath(55,190,g.start,g.start+72),g.name,g.key);
  base.addEventListener("click",()=>selectGroup(g));
  base.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectGroup(g)}});
  overlay.appendChild(base);

  const sub=72/5;
  g.details.forEach((label,j)=>{
    const z=zone("subzone",ringPath(190,315,g.start+j*sub,g.start+(j+1)*sub),label,g.key);
    z.dataset.label=label;
    z.addEventListener("click",()=>choose(g,label));
    z.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(g,label)}});
    overlay.appendChild(z);
  });
});

function selectGroup(g){
  current=g;
  viewport.classList.add("zoomed");
  document.querySelectorAll(".subzone").forEach(z=>z.classList.toggle("active",z.dataset.group===g.key));
  helper.textContent=`Kies nu een specifiekere emotie binnen ${g.name.toLowerCase()}.`;
  controls.classList.add("show");
  result.classList.remove("show");

  const mid=g.start+36;
  const [px,py]=point(245,mid);
  const ox=(px/645*100).toFixed(1);
  const oy=(py/710*100).toFixed(1);
  canvas.style.transformOrigin=`${ox}% ${oy}%`;
  canvas.style.transform="scale(1.55)";
}

function choose(g,label){
  const d=info[label];
  crumb.textContent=g.name+" →";
  choice.textContent=label;
  explanation.textContent=d[0];
  reflection.innerHTML="<strong>Sta even stil:</strong> "+d[1];
  result.classList.add("show");
}

function resetWheel(){
  current=null;
  viewport.classList.remove("zoomed");
  canvas.style.transform="scale(1)";
  canvas.style.transformOrigin="50% 50%";
  document.querySelectorAll(".subzone").forEach(z=>z.classList.remove("active"));
  helper.textContent="Klik op Blij, Boos, Bang, Bedroefd of Bah.";
  controls.classList.remove("show");
  result.classList.remove("show");
}

document.getElementById("back").addEventListener("click",resetWheel);
document.getElementById("reset").addEventListener("click",resetWheel);
})();
</script>
</body>
</html>
