<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent;overflow:hidden}body{font-family:Montserrat,Arial,sans-serif;color:#003c24;padding:14px 12px 20px}.panel{position:relative;isolation:isolate;max-width:780px;margin:auto;padding:25px 28px 27px;border:1.5px solid #d9e9d3;border-radius:18px;background:#fff;overflow:hidden}.panel:before{content:"";position:absolute;z-index:-1;right:-36px;top:-75px;width:210px;height:210px;background:#b8ffaf;opacity:.52;filter:blur(55px);border-radius:50%;animation:breathe 4s ease-in-out infinite}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#52785b;margin-bottom:13px;display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:#b8ffaf;box-shadow:0 0 0 4px #b8ffaf55,0 0 13px #b8ffaf}.question{font-size:clamp(21px,4.5vw,32px);font-weight:700;line-height:1.28;letter-spacing:-.035em;margin:0}.accent{height:3px;width:45px;border-radius:10px;background:#ff4a00;margin-top:19px}@keyframes breathe{50%{opacity:.85;transform:scale(1.12)}}@media(max-width:520px){body{padding:8px 4px 15px}.panel{padding:23px 20px;border-radius:14px}.question{font-size:23px}}@media(prefers-reduced-motion:reduce){.panel:before{animation:none}}
</style></head><body><section class="panel" aria-label="Centrale vraag van deze ontwikkelingsfase"><div class="eyebrow"><span class="dot"></span>De centrale vraag</div><h1 class="question" id="q">Wat vinden anderen van mij?</h1><div class="accent"></div></section><script>
const questions={vroeg:"Wat vinden anderen van mij?",midden:"Wie ben ik en wat wil ik zelf?",laat:"Welke richting wil ik op?"};const key=new URLSearchParams(location.search).get("fase")||"vroeg";document.getElementById("q").textContent=questions[key]||questions.vroeg;
</script></body></html>
