<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De centrale vraag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:transparent}
body{font-family:"Montserrat",Arial,sans-serif;color:#3e281a}
.wrap{width:100%;padding:8px 12px}
.question-card{max-width:900px;margin:0 auto;border-left:4px solid #96f0ff;padding:10px 18px;background:#fff}
.label{font-size:11px;font-weight:600;letter-spacing:.07em;color:#63716c;text-transform:uppercase;margin-bottom:7px}
.question{font-size:clamp(17px,3.3vw,21px);font-weight:500;line-height:1.4;color:#003c24;margin:0}
@media(max-width:550px){.wrap{padding:7px 9px}.question-card{padding:9px 13px}.question{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="question-card" aria-label="Centrale vraag van deze ontwikkelingsfase">
    <div class="label">De centrale vraag</div>
    <p class="question" id="q">“Wat vinden anderen van mij?”</p>
  </section>
</div>
<script>
const questions={vroeg:"Wat vinden anderen van mij?",midden:"Wie ben ik en wat wil ik zelf?",laat:"Welke richting wil ik op?"};
const phase=new URLSearchParams(location.search).get("fase")||"vroeg";
document.getElementById("q").textContent="“"+(questions[phase]||questions.vroeg)+"”";
</script>
</body>
</html>
