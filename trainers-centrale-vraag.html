<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centrale vraag</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Montserrat,Arial,sans-serif}
.wrap{padding:6px 10px;width:100%}
.card{max-width:900px;margin:auto;background:#003c24;color:#fff;border-radius:12px;padding:13px 17px;display:flex;align-items:center;gap:12px;min-height:56px}
.icon{width:29px;height:29px;flex:0 0 29px;border-radius:50%;background:#b8ffaf;color:#003c24;display:grid;place-items:center}
.icon svg{width:17px;height:17px}
.label{font-size:10px;letter-spacing:.06em;font-weight:600;color:#b8ffaf;white-space:nowrap}
.question{font-size:14px;line-height:1.45;font-weight:500;margin:0;min-width:0}
@media(max-width:550px){.wrap{padding:5px 7px}.card{padding:12px;gap:9px}.label{font-size:9px}.question{font-size:12px}.icon{width:25px;height:25px;flex-basis:25px}.icon svg{width:15px;height:15px}}
</style></head><body><div class="wrap"><section class="card" aria-label="Centrale vraag van deze fase"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span><span class="label">CENTRALE VRAAG</span><p class="question" id="q">Wat vinden anderen van mij?</p></section></div>
<script>const questions={vroeg:"Wat vinden anderen van mij?",midden:"Wie ben ik en wat wil ik zelf?",laat:"Welke richting wil ik op?"};const phase=new URLSearchParams(location.search).get("fase")||"vroeg";document.getElementById("q").textContent=questions[phase]||questions.vroeg;</script></body></html>
