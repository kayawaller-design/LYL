<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  font-family: "Montserrat", Arial, sans-serif;
  color: #3e281a;
}

.reminder {
  max-width: 760px;
  margin: 0 auto;
  min-height: 105px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-left: 5px solid #ff4a00;
  padding: 16px 18px;
}

.icon {
  flex: 0 0 54px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #fff1eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}

.text {
  font-size: 15px;
  line-height: 1.55;
  font-weight: 400;
  font-style: normal;
}

.title {
  display: block;
  color: #003c24;
  font-weight: 600;
  margin-bottom: 3px;
}

strong {
  font-weight: 600;
  color: #003c24;
}
</style>
</head>
<body>
<div class="reminder">
  <div class="icon">💡</div>
  <div class="text">
    <span class="title">Reminder</span>
    Een goed idee begint niet bij wat jij wilt maken, maar bij wat jouw doelgroep <strong>écht nodig heeft</strong>.
  </div>
</div>
</body>
</html>
