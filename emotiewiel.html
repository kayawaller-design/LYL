<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactief emotiewiel</title>
<style>
:root{--green:#003c24;--orange:#ff4a00;--brown:#3e281a;}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{margin:0;background:#fff;color:var(--brown)}
.wrap{max-width:820px;margin:auto;padding:14px}
.intro,.helper{text-align:center;line-height:1.45}
.intro{font-size:17px;margin:0 0 8px}
.helper{font-size:15px;color:var(--green);font-weight:700;margin:0 0 10px}
.viewport{position:relative;max-width:645px;aspect-ratio:645/640;margin:auto;overflow:hidden;background:#fff}
.canvas{position:absolute;inset:0;transition:transform .5s ease;transform-origin:50% 50%}
.canvas img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.overlay{position:absolute;inset:0;width:100%;height:100%;z-index:5}
.clickzone{fill:#fff;fill-opacity:.001;stroke:none;cursor:pointer;pointer-events:all}
.clickzone:hover{fill-opacity:.05}
.subzone{display:none}
.zoomed .basezone{display:none}
.zoomed .subzone.active{display:block}
.controls{display:none;justify-content:center;margin-top:12px}
.controls.show{display:flex}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer;font-family:Arial,Helvetica,sans-serif}
.back{background:var(--green);color:#fff}
.reset{background:var(--orange);color:#fff;margin-top:14px}
.result{display:none;max-width:645px;margin:14px auto 0;background:#f7fff5;border:2px solid #d7ead3;border-radius:16px;padding:18px;font-family:Arial,Helvetica,sans-serif}
.result.show{display:block}
.result *{font-family:Arial,Helvetica,sans-serif}
.result .crumb{font-size:14px;font-weight:700;color:var(--green);margin-bottom:5px}
.result h2{margin:0;color:var(--green);font-size:24px;font-weight:700}
.result p{font-size:16px;line-height:1.5;margin:10px 0 0;font-weight:400}
.reflect{padding-top:12px;border-top:1px solid #d7ead3}
@media(max-width:600px){.wrap{padding:8px}.intro{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <p class="intro">Kies eerst een basisemotie. Daarna zoomt het wiel in zodat je de specifiekere emoties beter kunt lezen.</p>
  <p class="helper" id="helper">Klik op Blij, Boos, Bang, Bedroefd of Bah.</p>

"Eenzaam":["Eenzaamheid betekent dat je behoefte hebt aan meer contact of verbinding, ook als er mensen om je heen zijn.","Met wie zou je contact willen maken?"],

"Leeg":["Je leeg voelen kan betekenen dat je weinig emotie of energie ervaart, alsof er even niets binnenkomt.","Wat heb je nodig om weer iets van ruimte of contact te voelen?"],
"Verdrietig":["Verdriet ontstaat wanneer iets pijn doet, tegenvalt of wanneer je iets of iemand mist.","Wat heeft jouw verdriet op dit moment nodig?"],
"Weerstand":["Weerstand betekent dat iets in jou 'nee' zegt. Je wilt iets niet of iets voelt niet goed.","Waar zegt jouw gevoel nu nee tegen?"],
"Afgewezen":["Je voelt je afgewezen wanneer je het idee hebt dat je niet wordt gekozen, geaccepteerd of erbij hoort.","Wat zou jou nu kunnen helpen om je weer gezien te voelen?"],
"Beschaamd":["Schaamte ontstaat wanneer je bang bent dat anderen negatief over jou denken of wanneer je jezelf veroordeelt.","Wat zou je tegen een vriend zeggen die hetzelfde meemaakt?"],
"Afstandelijk":["Je voelt je afstandelijk wanneer je minder contact wilt of emotioneel op afstand gaat.","Heb je nu ruimte nodig, of juist verbinding?"],
"Afkeer":["Afkeer is een sterk gevoel van 'dit wil ik niet'. Het kan je helpen afstand te nemen van iets dat niet goed voelt.","Waar wil je op dit moment afstand van nemen?"]
};

function point(r,deg){
  const a=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(a),cy+r*Math.sin(a)];
}
function ringPath(r1,r2,a0,a1){
  const A=point(r2,a0),B=point(r2,a1),C=point(r1,a1),D=point(r1,a0);
  return `M ${A[0]} ${A[1]} A ${r2} ${r2} 0 0 1 ${B[0]} ${B[1]} L ${C[0]} ${C[1]} A ${r1} ${r1} 0 0 0 ${D[0]} ${D[1]} Z`;
}
function zone(cls,d,label,group){
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",d); p.setAttribute("class","clickzone "+cls);
  p.setAttribute("aria-label",label); p.setAttribute("tabindex","0");
  p.dataset.group=group;
  return p;
}

groups.forEach(g=>{
  const base=zone("basezone",ringPath(55,190,g.start,g.start+72),g.name,g.key);
  base.addEventListener("click",()=>selectGroup(g));
  overlay.appendChild(base);

  const sub=72/5;
  g.details.forEach((label,j)=>{
    const z=zone("subzone",ringPath(190,315,g.start+j*sub,g.start+(j+1)*sub),label,g.key);
    z.dataset.label=label;
    z.addEventListener("click",()=>choose(g,label));
    overlay.appendChild(z);
  });
});

function selectGroup(g){
  viewport.classList.add("zoomed");
  document.querySelectorAll(".subzone").forEach(z=>z.classList.toggle("active",z.dataset.group===g.key));
  helper.textContent=`Kies nu een specifiekere emotie binnen ${g.name.toLowerCase()}.`;
  controls.classList.add("show");
  result.classList.remove("show");

  const mid=g.start+36;
  const [px,py]=point(245,mid);
  canvas.style.transformOrigin=`${(px/645*100).toFixed(1)}% ${(py/640*100).toFixed(1)}%`;
  canvas.style.transform="scale(1.55)";
}

function choose(g,label){
  const d=info[label];
  crumb.textContent=g.name+" →";
  choice.textContent=label;
  explanation.textContent=d[0];
  reflection.innerHTML="<strong>Sta even stil:</strong> "+d[1];
  result.classList.add("show");
}

function resetWheel(){
  viewport.classList.remove("zoomed");
  canvas.style.transform="scale(1)";
  canvas.style.transformOrigin="50% 50%";
  document.querySelectorAll(".subzone").forEach(z=>z.classList.remove("active"));
  helper.textContent="Klik op Blij, Boos, Bang, Bedroefd of Bah.";
  controls.classList.remove("show");
  result.classList.remove("show");
}
document.getElementById("back").addEventListener("click",resetWheel);
document.getElementById("reset").addEventListener("click",resetWheel);
})();
</script>
