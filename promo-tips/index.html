<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gouden tips voor je promo</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#181818;font-family:Inter,Arial,sans-serif}.wrap{max-width:840px;margin:auto;padding:24px 14px 32px}.heading{display:flex;align-items:center;gap:13px;margin-bottom:7px}.spark{width:51px;height:51px;display:grid;place-items:center;border-radius:17px;background:#ffe69d;font-size:27px;transform:rotate(-7deg)}h1{font-size:clamp(23px,4vw,31px);letter-spacing:-.8px;margin:0}.intro{color:#505050;margin:5px 0 23px;font-size:15px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;text-align:left;border:1px solid #e9e5dc;border-radius:19px;min-height:142px;padding:19px 18px;background:#fffdf7;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 25px #00000010;border-color:#e5bd62;outline:none}.card:nth-child(2){background:#f1f6ef}.card:nth-child(3){background:#f2f1fa}.card:nth-child(4){background:#fff2ed}.card:nth-child(5){background:#edf5f7;grid-column:1/-1;min-height:122px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.num{font-size:12px;font-weight:800;letter-spacing:1px;color:#77673d}.emoji{font-size:27px;filter:saturate(.85)}h2{font-size:18px;letter-spacing:-.3px;margin:0 0 7px}.card p{font-size:14px;line-height:1.5;color:#444;margin:0;max-width:380px}.more{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #00000016;font-size:13px;line-height:1.5;color:#333}.card.open .more{display:block}.hint{font-size:12px;color:#777;margin:12px 2px 20px}.check{display:flex;align-items:center;gap:13px;padding:18px 20px;border-radius:16px;background:#1e2a27;color:#fff}.check .icon{font-size:26px}.check strong{display:block;font-size:15px;margin-bottom:4px}.check p{font-size:13px;line-height:1.5;margin:0;color:#e1e9e5}@media(max-width:540px){.wrap{padding:16px 12px 25px}.cards{grid-template-columns:1fr;gap:10px}.card:nth-child(5){grid-column:auto}.card{min-height:0;padding:16px}.top{margin-bottom:10px}}</style></head><body><main class="wrap"><div class="heading"><div class="spark" aria-hidden="true">✦</div><h1>Gouden tips voor je promo</h1></div><p class="intro">Een goede promo zorgt dat mensen denken: <strong>daar wil ik bij zijn!</strong> Ontdek de vijf tips.</p><section class="cards"><button class="card" aria-expanded="false"><div class="top"><span class="num">TIP 01</span><span class="emoji">✨</span></div><h2>Pak de aandacht</h2><p>Verzin een pakkende titel die nieuwsgierig maakt.</p><div class="more"><strong>Probeer eens:</strong> Wat zou jou laten stoppen met scrollen?</div></button><button class="card" aria-expanded="false"><div class="top"><span class="num">TIP 02</span><span class="emoji">✂️</span></div><h2>Less is more</h2><p>Houd je tekst kort, krachtig en overzichtelijk.</p><div class="more"><strong>Probeer eens:</strong> Schrap alles wat niet echt nodig is.</div></button><button class="card" aria-expanded="false"><div class="top"><span class="num">TIP 03</span><span class="emoji">📍</span></div><h2>Alle info in één oogopslag</h2><p>Wat, waar, wanneer en voor wie? Maak het meteen duidelijk.</p><div class="more"><strong>Check:</strong> Kan iemand meedoen zonder eerst vragen te stellen?</div></button><button class="card" aria-expanded="false"><div class="top"><span class="num">TIP 04</span><span class="emoji">📣</span></div><h2>Vertel wat mensen moeten doen</h2><p>Aanmelden, delen of langskomen? Geef een duidelijke oproep.</p><div class="more"><strong>Bijvoorbeeld:</strong> ‘Meld je aan vóór vrijdag!’</div></button><button class="card" aria-expanded="false"><div class="top"><span class="num">TIP 05</span><span class="emoji">🎨</span></div><h2>Laat de sfeer zien</h2><p>Gebruik kleuren en beelden die passen bij jullie activiteit.</p><div class="more"><strong>Vraag jezelf af:</strong> Voelt je promo net zo leuk als de activiteit zelf?</div></button></section><p class="hint">↗ Klik op een kaartje voor een extra tip.</p><aside class="check"><span class="icon">✓</span><div><strong>De ultieme check</strong><p>Zou jij zelf begrijpen wat er te doen is én zin krijgen om mee te doen?</p></div></aside></main><script>document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{let v=c.classList.toggle('open');c.setAttribute('aria-expanded',String(v));}));</script></body></html>
