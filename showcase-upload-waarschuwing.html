<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#111}
.notice{display:flex;align-items:center;gap:17px;padding:17px 20px;border:1px solid #f1d8a9;border-radius:13px;background:#fffaf0;min-height:96px}
.symbol{position:relative;flex:none;width:49px;height:49px;display:grid;place-items:center;color:#a45d12}
.symbol:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#f8cc72;filter:blur(12px);opacity:.75;animation:glow 2.8s ease-in-out infinite}
.symbol svg{position:relative;width:35px;height:35px;filter:drop-shadow(0 0 5px #eeb95c)}
p{font-size:16px;line-height:1.55;margin:0}strong{font-weight:700}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:.85;transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){.symbol:before{animation:none}}
@media(max-width:450px){.notice{padding:14px;gap:12px}.symbol{width:38px;height:38px}.symbol svg{width:30px;height:30px}p{font-size:15px}}
</style></head><body><div class="notice" role="note"><div class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M10.3 3.8 2.1 18a2 2 0 0 0 1.7 3h16.4a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v5"/><path d="M12 17.5h.01"/></svg></div><p><strong>Belangrijk:</strong> Jullie moeten de PowerPoint vóór de volgende les uploaden op de Huddle-feed van jullie groep.</p></div></body></html>
