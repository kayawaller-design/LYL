<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vecht, vlucht, bevries</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

:root{
  --green:#003c24;
  --brown:#3e281a;
  --orange:#ff4a00;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:#fff;
  color:var(--brown);
  font-family:"Montserrat",Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:980px;
  margin:0 auto;
  padding:10px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.flip-card{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  padding:0;
  width:100%;
  height:255px;
  perspective:1000px;
  cursor:pointer;
  font:inherit;
  color:inherit;
}

.flip-inner{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .55s ease;
}

.flip-card.is-flipped .flip-inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
}

.front{
  background:#fff;
  border:2px solid #ececec;
}

.back{
  transform:rotateY(180deg);
  background:#fff;
  border:2px solid var(--green);
  align-items:flex-start;
  text-align:left;
}

.icon-img{
  width:118px;
  height:118px;
  object-fit:contain;
  display:block;
  margin-bottom:10px;
}

.front h2,
.back h3{
  margin:0;
  color:var(--green);
  font-weight:600;
}

.front h2{
  font-size:22px;
}

.front .tap{
  margin:8px 0 0;
  font-size:11px;
  font-weight:600;
  color:var(--green);
}

.back h3{
  font-size:18px;
  margin-bottom:9px;
}

.back p{
  margin:0;
  font-size:13px;
  line-height:1.5;
}

.flip-card:focus-visible{
  outline:3px solid var(--orange);
  outline-offset:3px;
  border-radius:18px;
}

@media(max-width:620px){
  .cards{gap:7px}
  .flip-card{height:245px}
  .face{padding:10px 7px}
  .icon-img{width:82px;height:82px}
  .front h2{font-size:16px}
  .front .tap{font-size:9px}
  .back h3{font-size:14px}
  .back p{font-size:10px;line-height:1.4}
}

@media(prefers-reduced-motion:reduce){
  .flip-inner{transition:none}
}
</style>
</head>
