<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px 16px;
  background: #ffffff;
  font-family: "Montserrat", Arial, sans-serif;
  color: #3e281a;
}

.tip {
  max-width: 720px;
  margin: 0 auto;
  min-height: 98px;
  display: flex;
  align-items: center;
  border-left: 5px solid #b8ffaf;
  padding: 14px 18px;
}

.icon {
  flex: 0 0 58px;
  width: 58px;
  height: 58px;
  margin-right: 18px;
  border-radius: 50%;
  background: #f1ffef;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  box-shadow:
    0 0 10px rgba(184,255,175,.75),
    0 0 22px rgba(184,255,175,.55),
    0 0 38px rgba(184,255,175,.35);
  animation: glow 2.2s ease-in-out infinite alternate;
}

@keyframes glow {
  from {
    box-shadow:
      0 0 8px rgba(184,255,175,.55),
      0 0 18px rgba(184,255,175,.35);
  }
  to {
    box-shadow:
      0 0 13px rgba(184,255,175,.95),
      0 0 28px rgba(184,255,175,.7),
      0 0 42px rgba(184,255,175,.45);
  }
}

.content { min-width: 0; }

.title {
  color: #003c24;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 600;
  margin: 0 0 5px;
}

.text {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  font-weight: 400;
  font-style: normal;
}

.text strong {
  font-weight: 600;
}

@media (max-width: 520px) {
  body { padding: 8px; }
  .tip { padding: 12px 14px; }
  .icon { margin-right: 14px; }
}
</style>
</head>
<body>
  <div class="tip">
    <div class="icon">💡</div>
    <div class="content">
      <div class="title">Reminder</div>
      <p class="text">Een goed idee begint niet bij wat jij wilt maken, maar bij wat jouw doelgroep <strong>écht nodig heeft</strong>.</p>
    </div>
  </div>
</body>
</html>
