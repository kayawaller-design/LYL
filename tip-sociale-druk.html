<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip – sociale druk</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#172b38}
.tip{display:flex;align-items:flex-start;gap:15px;padding:19px 20px;border-radius:17px;background:#f1f8f3;border:1px solid #dcece0;max-width:850px}
.symbol{flex:none;width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#dcefe0;color:#326b4d}
.symbol svg{width:24px;height:24px;animation:glow 2.7s ease-in-out infinite;transform-origin:center}
.heading{font-size:16px;font-weight:750;margin:0 0 6px}.body{font-size:15px;line-height:1.6;margin:0}
@keyframes glow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.68;transform:scale(1.09)}}
@media(prefers-reduced-motion:reduce){.symbol svg{animation:none}}
@media(max-width:480px){.tip{padding:15px;gap:11px}.symbol{width:38px;height:38px}.body{font-size:14px}}
</style>
</head>
<body>
<aside class="tip" aria-label="Tip voor trainers">
<div class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6m-5 3h4m-5.5-6.5C7 13.4 6 11.7 6 9.5a6 6 0 0 1 12 0c0 2.2-1 3.9-2.5 5L15 17H9l-.5-2.5Z"/><path d="M12 2V1m8 8h2M2 9h2m14.5-5.5 1.2-1.2M5.5 3.5 4.3 2.3"/></svg></div>
<div><p class="heading">Tip</p><p class="body"><strong>Jouw tool als trainer? Sociale druk bewust opbouwen!</strong> Laat jongeren bijvoorbeeld eerst in tweetallen overleggen voordat ze hun ideeën met de hele groep delen. Zo maak je de stap naar een grotere uitdaging kleiner.</p></div>
</aside>
</body></html>
