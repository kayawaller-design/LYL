<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;color:#151515;background:transparent}.list{display:grid;gap:9px}.item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid #e6e6e6;border-radius:10px;background:#fff;cursor:pointer}.item:hover{background:#fafafa}.item input{appearance:none;width:21px;height:21px;flex:none;border:1.8px solid #a7a7a7;border-radius:5px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center}.item input:checked{background:#327a65;border-color:#327a65}.item input:checked:after{content:"";width:10px;height:6px;border-left:2px solid white;border-bottom:2px solid white;transform:rotate(-45deg) translate(1px,-1px)}.item:has(input:checked){background:#f4faf7;border-color:#cce4d8}.item strong{font-weight:700}.item span{flex:1}@media(max-width:480px){body{font-size:15px}.item{padding:12px;gap:10px}}</style></head><body><div class="list">
<label class="item"><input type="checkbox"><span><strong>De activiteit:</strong> Wat hebben jullie georganiseerd?</span></label>
<label class="item"><input type="checkbox"><span><strong>Het doel:</strong> Wat wilden jullie bereiken? Is dat gelukt?</span></label>
<label class="item"><input type="checkbox"><span><strong>Het proces:</strong> Hoe verliep de voorbereiding?</span></label>
<label class="item"><input type="checkbox"><span><strong>De uitvoering:</strong> Hoe ging de activiteit zelf?</span></label>
<label class="item"><input type="checkbox"><span><strong>De reacties:</strong> Wat vond de doelgroep? Wat was de mooiste reactie?</span></label>
<label class="item"><input type="checkbox"><span><strong>De samenwerking:</strong> Hoe ging het samenwerken als team?</span></label>
<label class="item"><input type="checkbox"><span><strong>De lessen:</strong> Wat hebben jullie geleerd en wat zouden jullie anders doen?</span></label>
<label class="item"><input type="checkbox"><span><strong>Jullie impact:</strong> Wat heeft het uitvoeren van de activiteit met ieder van jullie gedaan?</span></label>
<label class="item"><input type="checkbox"><span><strong>Persoonlijke groei:</strong> Wat heeft ieder groepslid over zichzelf geleerd?</span></label>
<label class="item"><input type="checkbox"><span><strong>Beeldmateriaal:</strong> Voeg minimaal één foto of filmpje toe van jullie tijdens de activiteit.</span></label>
</div></body></html>
