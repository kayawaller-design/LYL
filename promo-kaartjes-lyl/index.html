<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Promo tips – Lead Your Life</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--forest:#003C24;--orange:#FF4A00;--blue:#96F0FF;--lime:#B8FFAF;--beige:#DDCDBA;--brown:#3E281A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--forest);font-family:Montserrat,Arial,sans-serif}main{max-width:820px;margin:auto;padding:12px 12px 22px}.intro{font-size:13px;line-height:1.65;margin:0 0 16px;color:#365445}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{font:inherit;color:var(--forest);position:relative;appearance:none;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;min-height:158px;padding:20px 20px 17px;border-radius:15px;background:var(--blue);transition:transform .18s,box-shadow .18s}.card:nth-child(2){background:var(--lime)}.card:nth-child(3){background:var(--beige);color:var(--brown)}.card:nth-child(4){background:var(--forest);color:#fff}.card:nth-child(5){background:#fff;border:2px solid var(--orange);grid-column:1/-1;min-height:132px;color:var(--forest)}.card:hover{transform:translateY(-3px);box-shadow:0 9px 22px #003c241a}.card:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.number{font-size:12px;font-weight:800;letter-spacing:1.2px;opacity:.78}.toggle{width:28px;height:28px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;font-weight:400;flex-shrink:0;transition:transform .18s}.card[aria-expanded=true] .toggle{transform:rotate(45deg)}h2{font-size:17px;line-height:1.3;letter-spacing:-.35px;margin:0 0 7px;font-weight:800}.card p{font-size:13px;line-height:1.55;font-weight:500;margin:0;max-width:470px}.extra{display:none;font-size:12px;line-height:1.65;font-weight:500;border-top:1px solid currentColor;margin-top:14px;padding-top:12px}.card[aria-expanded=true] .extra{display:block}.footer{margin-top:13px;border-radius:10px;padding:14px 17px;background:#f4f8f5;border-left:4px solid var(--orange);font-size:13px;line-height:1.6;color:var(--forest)}.footer strong{font-weight:800}@media(max-width:560px){main{padding:9px 9px 18px}.intro{font-size:12px;margin-bottom:12px}.cards{grid-template-columns:1fr;gap:9px}.card,.card:nth-child(5){grid-column:auto;min-height:0;padding:15px 16px;border-radius:12px}.top{margin-bottom:9px}.toggle{width:25px;height:25px;font-size:18px}h2{font-size:15px;margin-bottom:5px}.card p{font-size:12px}.footer{padding:12px;font-size:12px}}</style></head><body><main><p class="intro">Een goede promo trekt de aandacht én maakt meteen duidelijk wat er te doen is. Klik op een kaartje voor een extra tip.</p><section class="cards"><button class="card" aria-expanded="false"><div class="top"><span class="number">01 / AANDACHT</span><span class="toggle" aria-hidden="true">+</span></div><h2>Trek de aandacht</h2><p>Gebruik een pakkende titel die nieuwsgierig maakt.</p><div class="extra"><strong>Extra tip:</strong> Welke titel zou jou laten stoppen met scrollen?</div></button><button class="card" aria-expanded="false"><div class="top"><span class="number">02 / TEKST</span><span class="toggle" aria-hidden="true">+</span></div><h2>Houd het kort</h2><p>Maak je tekst kort en overzichtelijk.</p><div class="extra"><strong>Extra tip:</strong> Schrap alles wat mensen niet direct hoeven te weten.</div></button><button class="card" aria-expanded="false"><div class="top"><span class="number">03 / INFORMATIE</span><span class="toggle" aria-hidden="true">+</span></div><h2>Maak het duidelijk</h2><p>Vertel wat, waar, wanneer en voor wie de activiteit is.</p><div class="extra"><strong>Extra tip:</strong> Kan iemand op basis van je promo de activiteit vinden?</div></button><button class="card" aria-expanded="false"><div class="top"><span class="number">04 / ACTIE</span><span class="toggle" aria-hidden="true">+</span></div><h2>Vertel wat mensen kunnen doen</h2><p>Bijvoorbeeld aanmelden, delen of langskomen.</p><div class="extra"><strong>Extra tip:</strong> Gebruik een korte oproep zoals ‘Meld je aan!’</div></button><button class="card" aria-expanded="false"><div class="top"><span class="number">05 / UITSTRALING</span><span class="toggle" aria-hidden="true">+</span></div><h2>Laat de sfeer zien</h2><p>Kies kleuren en beelden die passen bij jullie activiteit.</p><div class="extra"><strong>Extra tip:</strong> Laat de uitstraling passen bij de sfeer van jullie activiteit.</div></button></section><div class="footer"><strong>Check je promo:</strong> Is in één oogopslag duidelijk wat jullie organiseren en hoe iemand kan meedoen?</div></main><script>document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{card.setAttribute('aria-expanded',String(card.getAttribute('aria-expanded')!=='true'))}))</script></body></html>
