<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gouden tips voor je promo</title><style>:root{--ink:#1d2924;--green:#194b3c;--soft:#e9f4ea;--line:#d5e3d7;--gold:#f4bb3f}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}main{max-width:790px;margin:auto;padding:20px 15px 28px}h1{font-size:clamp(21px,3vw,26px);line-height:1.2;letter-spacing:-.5px;margin:0 0 8px;font-weight:750}.lead{font-size:14px;line-height:1.55;color:#55625a;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{appearance:none;text-align:left;width:100%;font:inherit;cursor:pointer;border:1px solid #00000012;border-radius:12px;padding:17px 17px 15px;background:#f7ca4e;color:inherit;min-height:145px;transition:border-color .2s,transform .2s,box-shadow .2s}.card:nth-child(2){background:#bde5cf}.card:nth-child(5){background:#d8c7f5}.card:nth-child(3){background:#ffc4ac}.card:nth-child(4){background:#b9dcf2}.card:nth-child(5){grid-column:1/-1;min-height:115px}.card:hover{transform:translateY(-2px);border-color:#8daa9b;box-shadow:0 5px 15px #143c2410}.card:focus-visible{outline:2px solid var(--green);outline-offset:3px}.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.num{font-size:12px;letter-spacing:1px;font-weight:800;color:#315346}.plus{width:24px;height:24px;border-radius:50%;border:1px solid #44634b66;display:grid;place-items:center;font-size:17px;line-height:1;color:var(--green);transition:transform .2s}.card[aria-expanded=true] .plus{transform:rotate(45deg)}h2{font-size:16px;line-height:1.35;margin:0 0 7px;font-weight:700}.card p{font-size:13px;line-height:1.55;color:#34463e;margin:0}.extra{display:none;margin-top:13px;border-top:1px solid #dce7dd;padding-top:11px;font-size:13px;line-height:1.5;color:#354e3d}.card[aria-expanded=true] .extra{display:block}.foot{margin-top:15px;background:#1e5141;color:#fff;border-left:3px solid #f4bb3f;padding:13px 16px;border-radius:3px 9px 9px 3px;font-size:13px;line-height:1.55}.foot strong{color:#ffe18a}@media(max-width:540px){main{padding:15px 12px 22px}h1{font-size:21px}.lead{font-size:13px;margin-bottom:14px}.grid{grid-template-columns:1fr;gap:9px}.card,.card:nth-child(5){grid-column:auto;min-height:0;padding:13px 15px}.meta{margin-bottom:8px}h2{font-size:15px;margin-bottom:4px}.card p{font-size:13px}.foot{padding:12px}}</style></head><body><main><p class="lead">Hoe zorg je dat mensen enthousiast worden over jullie activiteit? Klik op een kaartje voor een extra tip.</p><section class="grid"><button class="card" aria-expanded="false"><div class="meta"><span class="num">01 / AANDACHT</span><span class="plus" aria-hidden="true">+</span></div><h2>Trek de aandacht</h2><p>Gebruik een pakkende titel die nieuwsgierig maakt.</p><div class="extra"><strong>Extra tip:</strong> Bedenk welke titel jou zou laten stoppen met scrollen.</div></button><button class="card" aria-expanded="false"><div class="meta"><span class="num">02 / TEKST</span><span class="plus" aria-hidden="true">+</span></div><h2>Houd het kort</h2><p>Maak je tekst kort en overzichtelijk.</p><div class="extra"><strong>Extra tip:</strong> Laat alleen staan wat mensen echt moeten weten.</div></button><button class="card" aria-expanded="false"><div class="meta"><span class="num">03 / INFORMATIE</span><span class="plus" aria-hidden="true">+</span></div><h2>Maak het duidelijk</h2><p>Vertel wat, waar, wanneer en voor wie de activiteit is.</p><div class="extra"><strong>Extra tip:</strong> Kan iemand met alleen jouw promo de activiteit vinden?</div></button><button class="card" aria-expanded="false"><div class="meta"><span class="num">04 / ACTIE</span><span class="plus" aria-hidden="true">+</span></div><h2>Vertel wat mensen kunnen doen</h2><p>Bijvoorbeeld aanmelden, delen of langskomen.</p><div class="extra"><strong>Extra tip:</strong> Schrijf een korte oproep, zoals ‘Meld je aan!’</div></button><button class="card" aria-expanded="false"><div class="meta"><span class="num">05 / UITSTRALING</span><span class="plus" aria-hidden="true">+</span></div><h2>Laat de sfeer zien</h2><p>Kies kleuren en beelden die passen bij jullie activiteit.</p><div class="extra"><strong>Extra tip:</strong> Laat je promo voelen zoals jullie activiteit straks zal zijn.</div></button></section><div class="foot"><strong>Check je promo:</strong> Is meteen duidelijk wat jullie organiseren en hoe iemand kan meedoen?</div></main><script>document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{card.setAttribute('aria-expanded',String(card.getAttribute('aria-expanded')!=='true'))}))</script></body></html>
