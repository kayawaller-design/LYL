<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neem mee</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:"Montserrat",Arial,sans-serif;color:#3e281a}
.wrap{width:100%;padding:12px 18px;background:#fff}
.tip{max-width:900px;margin:auto;display:flex;align-items:center;gap:18px;padding:17px 20px;background:#fff;border-left:5px solid #96f0ff;border-radius:0 14px 14px 0}
.icon{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:#f1fdff;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;animation:pop .6s ease-out both,glow 2.2s ease-in-out .7s infinite}
.icon::after{content:"";position:absolute;inset:-5px;border-radius:50%;animation:halo 2.2s ease-in-out .7s infinite}
.text{min-width:0}.label{margin:0 0 4px;color:#003c24;font-size:14px;font-weight:600}
p{margin:0;font-size:13px;line-height:1.6;color:#3e281a}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px rgba(255,196,0,.15))}50%{filter:drop-shadow(0 0 9px rgba(255,196,0,.75))}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,.05)}50%{box-shadow:0 0 18px 6px rgba(255,196,0,.20)}}
@media(prefers-reduced-motion:reduce){.icon,.icon::after{animation:none}}
@media(max-width:550px){.wrap{padding:8px 10px}.tip{gap:12px;padding:14px 12px}.icon{flex-basis:44px;width:44px;height:44px;font-size:23px}p{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="tip">
  <div class="icon" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#B8891A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6m-5 3h4M8.1 14.7a7 7 0 1 1 7.8 0c-.8.6-1.3 1.4-1.5 2.3H9.6c-.2-.9-.7-1.7-1.5-2.3Z"/></svg></div>
  <div class="text">
   <div class="label">Neem mee</div>
   <p>Kijk bij opvallend gedrag niet alleen naar <em>wat</em> een jongere doet, maar vraag je ook af: <em>wat speelt er op dit moment mee?</em></p>
  </div>
 </div>
</div>
</body>
</html>
