<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:"Montserrat",Arial,sans-serif;color:#3e281a}
.wrap{width:100%;padding:12px 18px;background:#fff}
.tip{max-width:900px;margin:auto;display:flex;align-items:center;gap:18px;padding:17px 20px;background:#fff;border-left:5px solid #b8ffaf;border-radius:0 14px 14px 0}
.icon{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:#f1fff0;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;animation:pop .6s ease-out both,pulse 2.3s ease-in-out .7s infinite}
.icon::after{content:"";position:absolute;inset:-5px;border-radius:50%;animation:halo 2.3s ease-in-out .7s infinite}
.label{margin:0 0 4px;color:#003c24;font-size:14px;font-weight:600}
p{margin:0;font-size:13px;line-height:1.6}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 1px rgba(184,255,175,.15))}50%{filter:drop-shadow(0 0 8px rgba(184,255,175,.8))}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(184,255,175,.05)}50%{box-shadow:0 0 18px 6px rgba(184,255,175,.25)}}
@media(prefers-reduced-motion:reduce){.icon,.icon::after{animation:none}}
@media(max-width:550px){.wrap{padding:8px 10px}.tip{gap:12px;padding:14px 12px}.icon{flex-basis:44px;width:44px;height:44px;font-size:23px}p{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tip">
    <div class="icon" aria-hidden="true">📖</div>
    <div>
      <div class="label">Tip</div>
      <p>Nu even geen zin om alle theorieën opnieuw door te nemen? Helemaal oké. Je kunt altijd later terugkomen naar deze module om alles nog eens rustig te bekijken.</p>
    </div>
  </div>
</div>
</body>
</html>
