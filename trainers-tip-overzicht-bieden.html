<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip · Overzicht bieden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #3e281a; font-family: Montserrat, sans-serif; }
.wrap { width: 100%; padding: 12px 18px; background: #fff; }
.tip { max-width: 900px; margin: auto; display: flex; align-items: center; gap: 18px; padding: 17px 20px; background: #fff; border-left: 5px solid #96f0ff; border-radius: 0 14px 14px 0; }
.icon { position: relative; flex: 0 0 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: #f1fdff; font-size: 27px; animation: pop .6s ease-out both, glow 2.2s ease-in-out .7s infinite; }
.icon::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 0 rgba(255,196,0,.32); animation: halo 2.2s ease-in-out .7s infinite; }
.label { font-size: 14px; font-weight: 600; color: #003c24; margin: 0 0 4px; }
p { margin: 0; font-size: 13px; line-height: 1.6; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes glow { 0%,100% { filter: drop-shadow(0 0 1px rgba(255,196,0,.15)); } 50% { filter: drop-shadow(0 0 9px rgba(255,196,0,.75)); } }
@keyframes halo { 0%,100% { box-shadow: 0 0 0 0 rgba(255,196,0,.05); } 50% { box-shadow: 0 0 18px 6px rgba(255,196,0,.20); } }
@media (max-width: 550px) {
  .wrap { padding: 8px 10px; }
  .tip { gap: 12px; padding: 14px 12px; }
  .icon { flex-basis: 44px; height: 44px; font-size: 23px; }
  p { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .icon, .icon::after { animation: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="tip" aria-labelledby="label">
    <span class="icon" aria-hidden="true">💡</span>
    <div>
      <h1 class="label" id="label">Tip</h1>
      <p><strong>Jouw tool als trainer? Overzicht bieden in plaats van de oplossing geven.</strong> Laat jongeren twee opties naast elkaar zetten en vraag wat hen aanspreekt en waarover ze twijfelen. Zo geef je ze ruimte om zelf te ontdekken welke keuze bij hen past.</p>
    </div>
  </section>
</main>
</body>
</html>
